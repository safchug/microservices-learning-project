name: All Services Tests

on:
  pull_request:
    branches:
      - master
      - main
      - develop
  push:
    branches:
      - master
      - main
      - develop

jobs:
  product-service-tests:
    name: Product Service Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        working-directory: services/product-service
        run: npm ci

      - name: Wait for services
        run: |
          echo "Waiting for services to be ready..."
          timeout 60 bash -c 'until curl -s http://localhost:9200/_cluster/health | grep -q "yellow\|green"; do sleep 2; done'
          echo "All services are ready!"

      - name: Run Product Service tests
        working-directory: services/product-service
        run: npm run test:cov
        env:
          MONGO_URI: mongodb://admin:admin123@localhost:27017/productdb-test?authSource=admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ELASTICSEARCH_NODE: http://localhost:9200

      - name: Upload Product Service coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./services/product-service/coverage/lcov.info
          flags: product-service
          fail_ci_if_error: false

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root dependencies
        run: npm install

      - name: Run Prettier check
        run: npx prettier --check .

      - name: Lint Product Service
        working-directory: services/product-service
        run: |
          npm install
          npm run lint

  build:
    name: Build Services
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - product-service
          - api-gateway
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci || npm install

      - name: Build service
        working-directory: services/${{ matrix.service }}
        run: npm run build

      - name: Check build output
        working-directory: services/${{ matrix.service }}
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful!"

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker-compose config

  # This job will block PR merge if any previous job fails
  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [product-service-tests, lint, build, docker-compose-check]
    if: always()

    steps:
      - name: Check if all jobs passed
        run: |
          if [ "${{ needs.product-service-tests.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.docker-compose-check.result }}" != "success" ]; then
            echo "❌ One or more checks failed. Cannot merge PR."
            exit 1
          fi
          echo "✅ All checks passed! PR is ready to merge."

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const productTests = '${{ needs.product-service-tests.result }}';
            const lint = '${{ needs.lint.result }}';
            const build = '${{ needs.build.result }}';
            const dockerCheck = '${{ needs.docker-compose-check.result }}';

            const statusIcon = (status) => status === 'success' ? '✅' : '❌';

            const comment = `## 🚀 CI/CD Checks

            | Check | Status |
            |-------|--------|
            | Product Service Tests | ${statusIcon(productTests)} ${productTests} |
            | Lint | ${statusIcon(lint)} ${lint} |
            | Build All Services | ${statusIcon(build)} ${build} |
            | Docker Compose | ${statusIcon(dockerCheck)} ${dockerCheck} |

            ${productTests === 'success' && lint === 'success' && build === 'success' && dockerCheck === 'success' 
              ? '✅ **All checks passed! This PR is ready to merge.**' 
              : '❌ **Some checks failed. Please fix the issues before merging.**'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
